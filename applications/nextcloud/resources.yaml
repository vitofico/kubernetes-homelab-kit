    \ } elseif (getenv('REDIS_HOST')[0] != '/') {\n    $CONFIG['redis']['port'] =
    6379;\n  }\n\n  if (getenv('REDIS_HOST_USER') !== false) {\n    $CONFIG['redis']['user']
    = (string) getenv('REDIS_HOST_USER');\n  }\n}"
  reverse-proxy.config.php: "<?php\n$overwriteHost = getenv('OVERWRITEHOST');\nif
    ($overwriteHost) {\n  $CONFIG['overwritehost'] = $overwriteHost;\n}\n\n$overwriteProtocol
    = getenv('OVERWRITEPROTOCOL');\nif ($overwriteProtocol) {\n  $CONFIG['overwriteprotocol']
    = $overwriteProtocol;\n}\n\n$overwriteCliUrl = getenv('OVERWRITECLIURL');\nif
    ($overwriteCliUrl) {\n  $CONFIG['overwrite.cli.url'] = $overwriteCliUrl;\n}\n\n$overwriteWebRoot
    = getenv('OVERWRITEWEBROOT');\nif ($overwriteWebRoot) {\n  $CONFIG['overwritewebroot']
    = $overwriteWebRoot;\n}\n\n$overwriteCondAddr = getenv('OVERWRITECONDADDR');\nif
    ($overwriteCondAddr) {\n  $CONFIG['overwritecondaddr'] = $overwriteCondAddr;\n}\n\n$trustedProxies
    = getenv('TRUSTED_PROXIES');\nif ($trustedProxies) {\n  $CONFIG['trusted_proxies']
    = array_filter(array_map('trim', explode(' ', $trustedProxies)));\n}\n\n$forwardedForHeaders
    = getenv('FORWARDED_FOR_HEADERS');\nif ($forwardedForHeaders) {\n  $CONFIG['forwarded_for_headers']
    = array_filter(array_map('trim', explode(' ', $forwardedForHeaders)));\n}"
  s3.config.php: "<?php\nif (getenv('OBJECTSTORE_S3_BUCKET')) {\n  $use_ssl = getenv('OBJECTSTORE_S3_SSL');\n
    \ $use_path = getenv('OBJECTSTORE_S3_USEPATH_STYLE');\n  $use_legacyauth = getenv('OBJECTSTORE_S3_LEGACYAUTH');\n
    \ $autocreate = getenv('OBJECTSTORE_S3_AUTOCREATE');\n  $CONFIG = array(\n    'objectstore'
    => array(\n      'class' => '\\OC\\Files\\ObjectStore\\S3',\n      'arguments'
    => array(\n        'bucket' => getenv('OBJECTSTORE_S3_BUCKET'),\n        'region'
    => getenv('OBJECTSTORE_S3_REGION') ?: '',\n        'hostname' => getenv('OBJECTSTORE_S3_HOST')
    ?: '',\n        'port' => getenv('OBJECTSTORE_S3_PORT') ?: '',\n        'storageClass'
    => getenv('OBJECTSTORE_S3_STORAGE_CLASS') ?: '',\n        'objectPrefix' => getenv(\"OBJECTSTORE_S3_OBJECT_PREFIX\")
    ? getenv(\"OBJECTSTORE_S3_OBJECT_PREFIX\") : \"urn:oid:\",\n        'autocreate'
    => strtolower($autocreate) !== 'false',\n        'use_ssl' => strtolower($use_ssl)
    !== 'false',\n        // required for some non Amazon S3 implementations\n        'use_path_style'
    => $use_path == true && strtolower($use_path) !== 'false',\n        // required
    for older protocol versions\n        'legacy_auth' => $use_legacyauth == true
    && strtolower($use_legacyauth) !== 'false'\n      )\n    )\n  );\n\n  if (getenv('OBJECTSTORE_S3_KEY_FILE'))
    {\n    $CONFIG['objectstore']['arguments']['key'] = trim(file_get_contents(getenv('OBJECTSTORE_S3_KEY_FILE')));\n
    \ } elseif (getenv('OBJECTSTORE_S3_KEY')) {\n    $CONFIG['objectstore']['arguments']['key']
    = getenv('OBJECTSTORE_S3_KEY');\n  } else {\n    $CONFIG['objectstore']['arguments']['key']
    = '';\n  }\n\n  if (getenv('OBJECTSTORE_S3_SECRET_FILE')) {\n    $CONFIG['objectstore']['arguments']['secret']
    = trim(file_get_contents(getenv('OBJECTSTORE_S3_SECRET_FILE')));\n  } elseif (getenv('OBJECTSTORE_S3_SECRET'))
    {\n    $CONFIG['objectstore']['arguments']['secret'] = getenv('OBJECTSTORE_S3_SECRET');\n
    \ } else {\n    $CONFIG['objectstore']['arguments']['secret'] = '';\n  }\n\n  if
    (getenv('OBJECTSTORE_S3_SSE_C_KEY_FILE')) {\n    $CONFIG['objectstore']['arguments']['sse_c_key']
    = trim(file_get_contents(getenv('OBJECTSTORE_S3_SSE_C_KEY_FILE')));\n  } elseif
    (getenv('OBJECTSTORE_S3_SSE_C_KEY')) {\n    $CONFIG['objectstore']['arguments']['sse_c_key']
    = getenv('OBJECTSTORE_S3_SSE_C_KEY');\n  }\n}"
  swift.config.php: "<?php\nif (getenv('OBJECTSTORE_SWIFT_URL')) {\n    $autocreate
    = getenv('OBJECTSTORE_SWIFT_AUTOCREATE');\n  $CONFIG = array(\n    'objectstore'
    => [\n      'class' => 'OC\\\\Files\\\\ObjectStore\\\\Swift',\n      'arguments'
    => [\n        'autocreate' => $autocreate == true && strtolower($autocreate) !==
    'false',\n        'user' => [\n          'name' => getenv('OBJECTSTORE_SWIFT_USER_NAME'),\n
    \         'password' => getenv('OBJECTSTORE_SWIFT_USER_PASSWORD'),\n          'domain'
    => [\n            'name' => (getenv('OBJECTSTORE_SWIFT_USER_DOMAIN')) ?: 'Default',\n
    \         ],\n        ],\n        'scope' => [\n          'project' => [\n            'name'
    => getenv('OBJECTSTORE_SWIFT_PROJECT_NAME'),\n            'domain' => [\n              'name'
    => (getenv('OBJECTSTORE_SWIFT_PROJECT_DOMAIN')) ?: 'Default',\n            ],\n
    \         ],\n        ],\n        'serviceName' => (getenv('OBJECTSTORE_SWIFT_SERVICE_NAME'))
    ?: 'swift',\n        'region' => getenv('OBJECTSTORE_SWIFT_REGION'),\n        'url'
