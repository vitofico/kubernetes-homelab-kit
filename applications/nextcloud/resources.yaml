apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: primary
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/part-of: mariadb
    app.kubernetes.io/version: '11.4'
  name: nextcloud-mariadb
  namespace: nextcloud
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: primary
      app.kubernetes.io/instance: nextcloud
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/part-of: mariadb
  serviceName: nextcloud-mariadb-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/component: primary
        app.kubernetes.io/instance: nextcloud
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/part-of: mariadb
        app.kubernetes.io/version: '11.4'
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: mariadb-root-password
              name: nextcloud-credentials
        - name: MARIADB_USER
          value: nextcloud
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: db-password
              name: nextcloud-credentials
        - name: MARIADB_DATABASE
          value: nextcloud
        image: docker.io/mariadb:11.4
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - mariadb-admin status -uroot -p"$MARIADB_ROOT_PASSWORD"
          failureThreshold: 3
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
        name: mariadb
        ports:
        - containerPort: 3306
          name: mysql
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - mariadb-admin ping -uroot -p"$MARIADB_ROOT_PASSWORD"
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 250m
            ephemeral-storage: 2Gi
            memory: 768Mi
          requests:
            cpu: 75m
            ephemeral-storage: 50Mi
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
        volumeMounts:
        - mountPath: /var/lib/mysql
          name: data
        - mountPath: /etc/mysql/conf.d/custom.cnf
          name: config
          subPath: custom.cnf
        - mountPath: /run/mysqld
          name: run
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: nextcloud-mariadb
      volumes:
      - configMap:
          name: nextcloud-mariadb
        name: config
      - emptyDir: {}
        name: run
      - emptyDir: {}
        name: tmp
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/component: primary
        app.kubernetes.io/instance: nextcloud
        app.kubernetes.io/name: mariadb
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
