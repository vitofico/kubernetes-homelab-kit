    </ifModule>

    # section for Apache 2.2 and 2.4

    <ifModule mod_autoindex.c>

    IndexIgnore *

    </ifModule>'
  apache-pretty-urls.config.php: "<?php\n$CONFIG = array (\n  'htaccess.RewriteBase'
    => '/',\n);"
  apcu.config.php: "<?php\n$CONFIG = array (\n  'memcache.local' => '\\OC\\Memcache\\APCu',\n);"
  apps.config.php: "<?php\n$CONFIG = array (\n  'apps_paths' => array (\n      0 =>
    array (\n              'path'     => OC::$SERVERROOT.'/apps',\n              'url'
    \     => '/apps',\n              'writable' => false,\n      ),\n      1 => array
    (\n              'path'     => OC::$SERVERROOT.'/custom_apps',\n              'url'
    \     => '/custom_apps',\n              'writable' => true,\n      ),\n  ),\n);"
  autoconfig.php: "<?php\n\n$autoconfig_enabled = false;\n\nif (getenv('SQLITE_DATABASE'))
    {\n    $AUTOCONFIG['dbtype'] = 'sqlite';\n    $AUTOCONFIG['dbname'] = getenv('SQLITE_DATABASE');\n
    \   $autoconfig_enabled = true;\n} elseif (getenv('MYSQL_DATABASE_FILE') && getenv('MYSQL_USER_FILE')
    && getenv('MYSQL_PASSWORD_FILE') && getenv('MYSQL_HOST')) {\n    $AUTOCONFIG['dbtype']
    = 'mysql';\n    $AUTOCONFIG['dbname'] = trim(file_get_contents(getenv('MYSQL_DATABASE_FILE')));\n
    \   $AUTOCONFIG['dbuser'] = trim(file_get_contents(getenv('MYSQL_USER_FILE')));\n
    \   $AUTOCONFIG['dbpass'] = trim(file_get_contents(getenv('MYSQL_PASSWORD_FILE')));\n
    \   $AUTOCONFIG['dbhost'] = getenv('MYSQL_HOST');\n    $autoconfig_enabled = true;\n}
    elseif (getenv('MYSQL_DATABASE') && getenv('MYSQL_USER') && getenv('MYSQL_PASSWORD')
    && getenv('MYSQL_HOST')) {\n    $AUTOCONFIG['dbtype'] = 'mysql';\n    $AUTOCONFIG['dbname']
    = getenv('MYSQL_DATABASE');\n    $AUTOCONFIG['dbuser'] = getenv('MYSQL_USER');\n
    \   $AUTOCONFIG['dbpass'] = getenv('MYSQL_PASSWORD');\n    $AUTOCONFIG['dbhost']
    = getenv('MYSQL_HOST');\n    $autoconfig_enabled = true;\n} elseif (getenv('POSTGRES_DB_FILE')
    && getenv('POSTGRES_USER_FILE') && getenv('POSTGRES_PASSWORD_FILE') && getenv('POSTGRES_HOST'))
    {\n    $AUTOCONFIG['dbtype'] = 'pgsql';\n    $AUTOCONFIG['dbname'] = trim(file_get_contents(getenv('POSTGRES_DB_FILE')));\n
    \   $AUTOCONFIG['dbuser'] = trim(file_get_contents(getenv('POSTGRES_USER_FILE')));\n
    \   $AUTOCONFIG['dbpass'] = trim(file_get_contents(getenv('POSTGRES_PASSWORD_FILE')));\n
    \   $AUTOCONFIG['dbhost'] = getenv('POSTGRES_HOST');\n    $autoconfig_enabled
    = true;\n} elseif (getenv('POSTGRES_DB') && getenv('POSTGRES_USER') && getenv('POSTGRES_PASSWORD')
    && getenv('POSTGRES_HOST')) {\n    $AUTOCONFIG['dbtype'] = 'pgsql';\n    $AUTOCONFIG['dbname']
    = getenv('POSTGRES_DB');\n    $AUTOCONFIG['dbuser'] = getenv('POSTGRES_USER');\n
    \   $AUTOCONFIG['dbpass'] = getenv('POSTGRES_PASSWORD');\n    $AUTOCONFIG['dbhost']
    = getenv('POSTGRES_HOST');\n    $autoconfig_enabled = true;\n}\n\nif ($autoconfig_enabled)
    {\n    $AUTOCONFIG['directory'] = getenv('NEXTCLOUD_DATA_DIR') ?: '/var/www/html/data';\n}"
  maintenance.config.php: "<?php\n$CONFIG = array (\n  'maintenance_window_start'
    => 1,\n);"
  preview.config.php: "<?php\n$CONFIG = array (\n  'enable_previews' => 'true',\n
    \ 'enabledPreviewProviders' => array (\n    0 => 'OC\\Preview\\Movie',\n    1
    => 'OC\\Preview\\PNG',\n    2 => 'OC\\Preview\\JPEG',\n    3 => 'OC\\Preview\\GIF',\n
    \   4 => 'OC\\Preview\\BMP',\n    5 => 'OC\\Preview\\XBitmap',\n    6 => 'OC\\Preview\\MP3',\n
    \   7 => 'OC\\Preview\\MP4',\n    8 => 'OC\\Preview\\TXT',\n    9 => 'OC\\Preview\\MarkDown',\n
    \   10 => 'OC\\Preview\\PDF',\n  ),\n);"
  redis.config.php: "<?php\nif (getenv('REDIS_HOST')) {\n  $CONFIG = array(\n    'memcache.distributed'
    => '\\OC\\Memcache\\Redis',\n    'memcache.locking' => '\\OC\\Memcache\\Redis',\n
    \   'redis' => array(\n      'host' => getenv('REDIS_HOST'),\n      'password'
