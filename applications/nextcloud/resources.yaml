apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: files-scan
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/name: nextcloud
  name: nextcloud-files-scan
  namespace: nextcloud
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: files-scan
            app.kubernetes.io/instance: nextcloud
            app.kubernetes.io/name: nextcloud
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - "if [ -e /var/www/html/config/.homelab-upgrade-hold ]; then\n  echo
              \"Nextcloud upgrade hold; skipping file scan\"\n  exit 0\nfi\nexec su
              -s /bin/sh www-data -c 'php /var/www/html/occ files:scan user-d --path=\"/user-d/files/HighResPhotos\"'\n"
            env:
            - name: MYSQL_HOST
              value: nextcloud-mariadb
            - name: MYSQL_DATABASE
              value: nextcloud
            - name: MYSQL_USER
              value: nextcloud
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: db-password
                  name: nextcloud-credentials
            - name: REDIS_HOST
              value: nextcloud-redis-master
            - name: REDIS_HOST_PORT
              value: '6379'
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: redis-password
                  name: nextcloud-credentials
            - name: NEXTCLOUD_DATA_DIR
              value: /var/www/html/data
            image: docker.io/library/nextcloud:35.0.2-apache@sha256:e0b1a2af52c82c07b7a0e8e59878bd8769e704447734d5d238a836982f51b9c8
            imagePullPolicy: IfNotPresent
            name: files-scan
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            volumeMounts:
            - mountPath: /var/www/
              name: nextcloud-main
              subPath: root
            - mountPath: /var/www/html
              name: nextcloud-main
              subPath: html
            - mountPath: /var/www/html/data
              name: nextcloud-main
              subPath: data
            - mountPath: /var/www/html/config
              name: nextcloud-main
              subPath: config
            - mountPath: /var/www/html/custom_apps
              name: nextcloud-main
              subPath: custom_apps
            - mountPath: /var/www/html/config/redis.config.php
              name: nextcloud-config
              subPath: redis.config.php
          initContainers:
          - command:
            - sh
            - -c
            - until mariadb --host=nextcloud-mariadb --user=${MYSQL_USER} --password=${MYSQL_PASSWORD}
              --execute="SELECT 1;"; do echo waiting for mysql; sleep 2; done;
            env:
            - name: MYSQL_USER
              value: nextcloud
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: db-password
                  name: nextcloud-credentials
            image: docker.io/mariadb:11.4
            name: mariadb-isalive
            resources:
              limits:
                cpu: 200m
                memory: 128Mi
              requests:
                cpu: 50m
                memory: 64Mi
            volumeMounts: []
          restartPolicy: Never
          securityContext:
            fsGroup: 33
          volumes:
          - name: nextcloud-main
            persistentVolumeClaim:
              claimName: nextcloud-nfs-pvc
          - configMap:
              name: nextcloud-config
            name: nextcloud-config
  schedule: 10 * * * *
  successfulJobsHistoryLimit: 3
  suspend: true
