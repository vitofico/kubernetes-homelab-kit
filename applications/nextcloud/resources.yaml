  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/version: 35.0.2
    helm.sh/chart: nextcloud-8.9.0
  name: nextcloud
  namespace: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/instance: nextcloud
      app.kubernetes.io/name: nextcloud
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        hooks-hash: 44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a
        nextcloud-config-hash: 9589e8ea35191a966fc83ffe97bb1b0b7484df4cf8bbdd130ceaaa1f7caf3766
        php-config-hash: 44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/instance: nextcloud
        app.kubernetes.io/name: nextcloud
        nextcloud-redis-client: 'true'
    spec:
      containers:
      - env:
        - name: NEXTCLOUD_INIT_HTACCESS
          value: 'true'
        - name: OVERWRITEPROTOCOL
          value: https
        - name: MYSQL_HOST
          value: nextcloud-mariadb
        - name: MYSQL_DATABASE
          value: nextcloud
        - name: MYSQL_USER
          value: nextcloud
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: db-password
              name: nextcloud-credentials
        - name: NEXTCLOUD_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: nextcloud-credentials
        - name: NEXTCLOUD_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: nextcloud-credentials
        - name: NEXTCLOUD_TRUSTED_DOMAINS
          value: nextcloud.__DOMAIN__ nextcloud.__DOMAIN__
        - name: NEXTCLOUD_DATA_DIR
          value: /var/www/html/data
        - name: MAIL_FROM_ADDRESS
          value: homelab
        - name: MAIL_DOMAIN
          value: __DOMAIN__
        - name: SMTP_SECURE
          value: starttls
        - name: SMTP_PORT
          value: '587'
        - name: SMTP_AUTHTYPE
          value: LOGIN
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              key: smtp-host
              name: nextcloud-credentials
        - name: SMTP_NAME
          valueFrom:
            secretKeyRef:
              key: smtp-username
              name: nextcloud-credentials
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: smtp-password
              name: nextcloud-credentials
        - name: REDIS_HOST
          value: nextcloud-redis-master
        - name: REDIS_HOST_PORT
          value: '6379'
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              key: redis-password
              name: nextcloud-credentials
        image: docker.io/library/nextcloud:35.0.2-apache@sha256:e0b1a2af52c82c07b7a0e8e59878bd8769e704447734d5d238a836982f51b9c8
