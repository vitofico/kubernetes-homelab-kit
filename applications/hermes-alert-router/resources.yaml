apiVersion: v1
kind: Namespace
metadata:
  name: agent
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: hermes-alert-router
  name: hermes-alert-router
  namespace: agent
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: hermes-alert-router
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hermes-alert-router
  name: hermes-alert-router
  namespace: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-alert-router
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes-alert-router
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: WEBHOOK_SHARED_SECRET
          valueFrom:
            secretKeyRef:
              key: webhook-shared-secret
              name: hermes-alert-router-shared
        - name: HERMES_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: HERMES_WEBHOOK_SECRET
              name: hermes-agent-secrets
        - name: HERMES_URL
          value: http://hermes-agent.agent.svc.cluster.local:8644/webhooks/uptime-kuma
        - name: LOG_LEVEL
          value: INFO
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: TMPDIR
          value: /tmp
        image: __IMAGE_HERMES_ALERT_ROUTER__
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        name: router
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 20m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: tmp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-alert-router-allow-egress-dns
  namespace: agent
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  podSelector:
    matchLabels:
      app: hermes-alert-router
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-alert-router-allow-egress-hermes
  namespace: agent
spec:
  egress:
  - ports:
    - port: 8644
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: hermes-agent
  podSelector:
    matchLabels:
      app: hermes-alert-router
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-alert-router-allow-from-uptime-kuma
  namespace: agent
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uptime-kuma
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app: hermes-alert-router
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-alert-router-default-deny-egress
  namespace: agent
spec:
  podSelector:
    matchLabels:
      app: hermes-alert-router
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-alert-router-default-deny-ingress
  namespace: agent
spec:
  podSelector:
    matchLabels:
      app: hermes-alert-router
  policyTypes:
  - Ingress
