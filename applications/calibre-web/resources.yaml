apiVersion: v1
kind: Namespace
metadata:
  labels:
    name: calibre-web
  name: calibre-web
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: calibre-web
  name: calibre-web
  namespace: calibre-web
spec:
  ports:
  - name: http
    port: 8083
    targetPort: http
  selector:
    app: calibre-web
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: calibre-web-ingest-pv
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 500Mi
  mountOptions:
  - soft
  - timeo=30
  - retrans=3
  nfs:
    server: __NFS_SERVER__
    path: __NFS_ROOT__/calibre-web-ingest-pv
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-config
  namespace: calibre-web
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: microk8s-hostpath
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-ingest
  namespace: calibre-web
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 500Mi
  storageClassName: nfs
  volumeName: calibre-web-ingest-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-library
  namespace: calibre-web
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: microk8s-hostpath
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: calibre-web
  name: calibre-web
  namespace: calibre-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calibre-web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: calibre-web
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: UTC
        - name: CWA_WATCH_MODE
          value: poll
        - name: TRUSTED_PROXY_COUNT
          value: '1'
        image: crocodilestick/calibre-web-automated:v4.0.8@sha256:5e00373854247750cc3e4479b492ae09293ff5e06ed10177f226634d97888679
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 8083
          initialDelaySeconds: 120
          periodSeconds: 30
        name: calibre-web
        ports:
        - containerPort: 8083
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 50m
            memory: 512Mi
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /calibre-library
          name: library
        - mountPath: /cwa-book-ingest
          name: ingest
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: calibre-web-config
      - name: library
        persistentVolumeClaim:
          claimName: calibre-web-library
      - name: ingest
        persistentVolumeClaim:
          claimName: calibre-web-ingest
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: local-selfsigned
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
  name: calibre-web
  namespace: calibre-web
spec:
  ingressClassName: traefik
  rules:
  - host: ebooks.__DOMAIN__
    http:
      paths:
      - backend:
          service:
            name: quire-server
            port:
              number: 80
        path: /sync/
        pathType: Prefix
      - backend:
          service:
            name: quire-server
            port:
              number: 80
        path: /ai/
        pathType: Prefix
      - backend:
          service:
            name: quire-server
            port:
              number: 80
        path: /library/
        pathType: Prefix
      - backend:
          service:
            name: quire-server
            port:
              number: 80
        path: /quire-admin
        pathType: Prefix
      - backend:
          service:
            name: calibre-web
            port:
              number: 8083
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - ebooks.__DOMAIN__
    secretName: calibre-web-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-solver
  namespace: calibre-web
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - port: 8089
      protocol: TCP
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: 'true'
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-quire-server
  namespace: calibre-web
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: quire-server
    ports:
    - port: 8083
      protocol: TCP
  podSelector:
    matchLabels:
      app: calibre-web
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-traefik
  namespace: calibre-web
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - port: 8083
      protocol: TCP
  podSelector:
    matchLabels:
      app: calibre-web
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: calibre-web
spec:
  podSelector: {}
  policyTypes:
  - Ingress
