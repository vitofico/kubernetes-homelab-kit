apiVersion: v1
kind: Namespace
metadata:
  labels:
    name: agent
  name: agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
  namespace: agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-agent
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - persistentvolumeclaims
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-agent
subjects:
- kind: ServiceAccount
  name: hermes-agent
  namespace: agent
---
apiVersion: v1
data:
  config.yaml: "model:\n  provider: anthropic\n  default: claude-sonnet-4-6\nagent:\n\
    \  max_turns: 20\nplatforms:\n  webhook:\n    enabled: true\n    extra:\n    \
    \  routes:\n        uptime-kuma:\n          toolsets: []\n          deliver: log\n\
    \      host: 0.0.0.0\n"
  SOUL.md: 'You are a helpful assistant. Follow the operator instructions and protect
    private data.

    '
kind: ConfigMap
metadata:
  name: hermes-agent-config
  namespace: agent
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: hermes-agent
  name: hermes-agent
  namespace: agent
spec:
  ports:
  - name: webhook
    port: 8644
    targetPort: webhook
  selector:
    app: hermes-agent
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-agent-data
  namespace: agent
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: microk8s-hostpath
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hermes-agent
  name: hermes-agent
  namespace: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      containers:
      - env:
        - name: PATH
          value: /opt/data/media-bin:/opt/data/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              key: anthropic
              name: ai-provider-keys
        - name: HOME
          value: /opt/data
        - name: HERMES_HOME
          value: /opt/data/.hermes
        - name: HERMES_WRITE_SAFE_ROOT
          value: /opt/data
        - name: WEBHOOK_ENABLED
          value: 'true'
        - name: WEBHOOK_PORT
          value: '8644'
        - name: WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-agent-secrets
              key: HERMES_WEBHOOK_SECRET
        - name: HERMES_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-agent-secrets
              key: HERMES_WEBHOOK_SECRET
        image: __IMAGE_HERMES_AGENT__
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8644
          initialDelaySeconds: 60
          periodSeconds: 30
        name: hermes
        ports:
        - containerPort: 8644
          name: webhook
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8644
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 10000
          runAsNonRoot: true
          runAsUser: 10000
        volumeMounts:
        - mountPath: /opt/data
          name: hermes-data
        - name: hermes-ops-code
          mountPath: /opt/hermes-ops
          readOnly: true
      initContainers:
      - name: prepare-hermes-home
        image: busybox:1.37
        command:
        - sh
        - -ec
        args:
        - test ! -L /opt/data/.hermes; mkdir -p /opt/data/.hermes; chown 10000:10000
          /opt/data /opt/data/.hermes; chmod u+rwx /opt/data /opt/data/.hermes
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
      - name: copy-config
        image: busybox:1.37
        command:
        - sh
        - -ec
        args:
        - mkdir -p /opt/data/.hermes/skills/cluster-ops; cp /config-ro/config.yaml
          /opt/data/.hermes/config.yaml; cp /config-ro/SOUL.md /opt/data/.hermes/SOUL.md;
          cp /skill-ro/SKILL.md /opt/data/.hermes/skills/cluster-ops/SKILL.md
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
        - name: hermes-config
          mountPath: /config-ro
          readOnly: true
        - name: hermes-ops-skill
          mountPath: /skill-ro
          readOnly: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: hermes-agent
      volumes:
      - name: hermes-data
        persistentVolumeClaim:
          claimName: hermes-agent-data
      - configMap:
          name: hermes-agent-config
        name: hermes-config
      - name: hermes-ops-code
        configMap:
          name: hermes-ops-code
      - name: hermes-ops-skill
        configMap:
          name: hermes-ops-skill
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-router
  namespace: agent
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: hermes-alert-router
    ports:
    - port: 8644
      protocol: TCP
  podSelector:
    matchLabels:
      app: hermes-agent
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: agent
spec:
  podSelector: {}
  policyTypes:
  - Ingress
