apiVersion: v1
kind: PersistentVolume
metadata:
  name: mediaserver-media-pv
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 1Ti
  mountOptions:
  - soft
  - timeo=30
  - retrans=3
  nfs:
    server: __NFS_SERVER__
    path: __NFS_ROOT__/mediaserver-media-pv
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mediaserver-media
  namespace: k8s-mediaserver
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  storageClassName: nfs
  volumeName: mediaserver-media-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: k8s-mediaserver
    app.kubernetes.io/name: k8s-mediaserver
  name: flaresolverr
  namespace: k8s-mediaserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
      app.kubernetes.io/instance: k8s-mediaserver
      app.kubernetes.io/name: k8s-mediaserver
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: flaresolverr
        app.kubernetes.io/instance: k8s-mediaserver
        app.kubernetes.io/name: k8s-mediaserver
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                  - k8s-mediaserver
              topologyKey: kubernetes.io/hostname
            weight: 100
      automountServiceAccountToken: false
      containers:
      - env:
        - name: LOG_LEVEL
          value: info
        - name: TZ
          value: UTC
        image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8191
          initialDelaySeconds: 30
          periodSeconds: 30
        name: flaresolverr
        ports:
        - containerPort: 8191
          name: solverr-port
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: 8191
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 10
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts: []
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: k8s-mediaserver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: k8s-mediaserver
    app.kubernetes.io/version: 0.10.0
    helm.sh/chart: k8s-mediaserver-0.10.0
  name: jellyfin
  namespace: k8s-mediaserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: k8s-mediaserver
      app.kubernetes.io/name: k8s-mediaserver
  template:
    metadata:
      labels:
        app: jellyfin
        app.kubernetes.io/instance: k8s-mediaserver
        app.kubernetes.io/name: k8s-mediaserver
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: jellyfin-config
        image: docker.io/linuxserver/jellyfin:latest@sha256:3894d9eae88418d3cf9ac6349392d2c4dad818365a59565d19edc38098897044
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 60
          periodSeconds: 30
        name: k8s-mediaserver
        ports:
        - containerPort: 8096
          name: jellyfin-port
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 20
          periodSeconds: 15
          tcpSocket:
            port: 8096
        resources:
          limits:
            cpu: 4000m
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - mountPath: /config
          name: mediaserver-volume
          subPath: config/jellyfin
        - mountPath: /movies
          name: mediaserver-media
          subPath: media/movies
        - mountPath: /tv
          name: mediaserver-media
          subPath: media/tv
        - mountPath: /music
          name: mediaserver-media
          subPath: media/music
      securityContext:
        fsGroup: 1000
        supplementalGroups:
        - 44
        - 993
      volumes:
      - hostPath:
          path: __NFS_ROOT__/mediaserver-config
        name: mediaserver-volume
      - name: mediaserver-media
        persistentVolumeClaim:
          claimName: mediaserver-media
