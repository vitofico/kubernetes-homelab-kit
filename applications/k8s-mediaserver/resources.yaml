apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: local-selfsigned
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
  labels:
    app.kubernetes.io/instance: k8s-mediaserver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: k8s-mediaserver
    app.kubernetes.io/version: 0.10.0
    helm.sh/chart: k8s-mediaserver-0.10.0
  name: jellyfin
  namespace: k8s-mediaserver
spec:
  ingressClassName: traefik
  rules:
  - host: jellyfin.__DOMAIN__
    http:
      paths:
      - backend:
          service:
            name: jellyfin
            port:
              number: 8096
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - jellyfin.__DOMAIN__
    secretName: jellyfin-tls
---
