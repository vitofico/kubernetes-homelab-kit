apiVersion: v1
kind: Namespace
metadata:
  name: dynamic-dns-updater
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dynamic-dns-updater
  namespace: dynamic-dns-updater
spec:
  schedule: '*/15 * * * *'
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: updater
            image: __IMAGE_DYNAMIC_DNS_UPDATER__
            imagePullPolicy: IfNotPresent
            command: ['/usr/local/bin/update_dns.sh']
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
