apiVersion: v1
kind: Namespace
metadata:
  name: immich
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: immich-deduper
  name: immich-deduper
  namespace: immich
spec:
  ports:
  - name: http
    port: 8086
    targetPort: 8086
  selector:
    app: immich-deduper
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: immich-deduper-qdrant
  name: immich-deduper-qdrant
  namespace: immich
spec:
  ports:
  - name: http
    port: 6333
    targetPort: 6333
  - name: grpc
    port: 6334
    targetPort: 6334
  selector:
    app: immich-deduper-qdrant
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: immich-deduper
  name: immich-deduper-data
  namespace: immich
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: immich-deduper-qdrant
  name: immich-deduper-qdrant-data
  namespace: immich
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: immich-deduper
  name: immich-deduper
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-deduper
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich-deduper
    spec:
      containers:
      - env:
        - name: DEDUP_PORT
          value: '8086'
        - name: PSQL_HOST
          value: immich-postgresql.immich.svc.cluster.local
        - name: PSQL_PORT
          value: '5432'
        - name: PSQL_USER
          value: immich
        - name: PSQL_PASS
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: immich-secrets
        - name: PSQL_DB
          value: immich
        - name: QDRANT_URL
          value: http://immich-deduper-qdrant.immich.svc.cluster.local:6333
        - name: IMMICH_PATH
          value: /immich
        image: razgrizhsu/immich-deduper:latest-cpu@sha256:16faa123117a78c48b3790ce52ce6b23527b98c6b646eaa8c12ba4bb48a67b71
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 30
        name: immich-deduper
        ports:
        - containerPort: 8086
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 8086
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 2000m
            memory: 4Gi
          requests:
            cpu: 100m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /app/data
          name: dedup-data
        - mountPath: /root/.cache/torch
          name: dedup-cache
        - mountPath: /immich
          name: immich-upload
          readOnly: true
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: dedup-data
        persistentVolumeClaim:
          claimName: immich-deduper-data
      - emptyDir: {}
        name: dedup-cache
      - name: immich-upload
        persistentVolumeClaim:
          claimName: immich-upload
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: immich-deduper-qdrant
  name: immich-deduper-qdrant
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-deduper-qdrant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich-deduper-qdrant
    spec:
      containers:
      - image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /healthz
            port: 6333
          initialDelaySeconds: 15
          periodSeconds: 30
        name: qdrant
        ports:
        - containerPort: 6333
          name: http
        - containerPort: 6334
          name: grpc
        readinessProbe:
          httpGet:
            path: /healthz
            port: 6333
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /qdrant/storage
          name: qdrant-data
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: qdrant-data
        persistentVolumeClaim:
          claimName: immich-deduper-qdrant-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-deduper
  namespace: immich
spec:
  ingressClassName: traefik
  rules:
  - host: immich-deduper.__DOMAIN__
    http:
      paths:
      - backend:
          service:
            name: immich-deduper
            port:
              number: 8086
        path: /
        pathType: Prefix
