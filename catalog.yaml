      - anthropic
      hermes-agent-secrets:
      - HERMES_WEBHOOK_SECRET
    kind_supported: false
    reason: Requires provider credentials and operator-reviewed API and messaging access; not enabled by default.
    required_images:
      __IMAGE_HERMES_AGENT__: Pin a reviewed ghcr.io/vitofico/hermes-agent release by digest
    depends_on: []
