apps:
  ad-alta-voce-dl:
    path: applications/ad-alta-voce-dl
    namespace: ad-alta-voce-dl
    secrets:
      gluetun-vpn-credentials:
      - OPENVPN_PASSWORD
      - OPENVPN_USER
      - VPN_SERVICE_PROVIDER
      - VPN_TYPE
    kind_supported: false
    reason: Requires an operator-supplied image; not enabled by default.
    required_images:
      __IMAGE_AD_ALTA_VOCE_DL__: Supply a publicly accessible compatible image for
        ad-alta-voce-dl
    depends_on:
    - traefik
    - cert-manager
