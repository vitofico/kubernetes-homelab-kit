name: Validate and exercise template
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python and shell dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y age shellcheck
      - name: Install pinned kind and SOPS
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          curl -fsSLo kind.sha256sum https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64.sha256sum
          sed 's/kind-linux-amd64/kind/' kind.sha256sum | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          curl -fsSLO https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          curl -fsSLO https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.checksums.txt
          grep ' sops-v3.13.3.linux.amd64$' sops-v3.13.3.checksums.txt | sha256sum -c -
          chmod +x sops-v3.13.3.linux.amd64
          sudo mv sops-v3.13.3.linux.amd64 /usr/local/bin/sops
          rm -f kind.sha256sum sops-v3.13.3.checksums.txt
      - name: Install pinned Kustomize and Gitleaks
        working-directory: /tmp
        run: |
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          echo '6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  kubectl' | sha256sum -c -
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          curl -fsSLO https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz
          echo 'cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61  kustomize_v5.8.3_linux_amd64.tar.gz' | sha256sum -c -
          tar -xzf kustomize_v5.8.3_linux_amd64.tar.gz kustomize
          sudo mv kustomize /usr/local/bin/kustomize
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Static and unit checks
        run: make lint test
      - name: Validate every catalog application against Kubernetes and CRD schemas
        run: make validate-all VALIDATE_FLAGS=--prepare
      - name: Privacy audit
        run: python tools/audit-publication.py
      - name: Secret scan publication snapshot and complete history
        run: |
          mkdir /tmp/publication-check
          git archive HEAD | tar -x -C /tmp/publication-check
          gitleaks dir /tmp/publication-check --redact=100 --no-banner --ignore-gitleaks-allow
          gitleaks git . --log-opts=--all --redact=100 --no-banner --ignore-gitleaks-allow
      - name: Docker kind integration
        run: make test-kind
